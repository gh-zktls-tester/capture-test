name: verifyattest
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id whose hello artifact should be verified'
        required: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hello
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: What a consumer sees
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x hello
          echo "--- digest of the artifact we are about to verify:"
          sha256sum hello
          echo "--- gh attestation verify:"
          gh attestation verify hello --repo ${{ github.repository }} 2>&1
          echo "--- and with the flag that is supposed to exclude this case:"
          gh attestation verify hello --repo ${{ github.repository }} --deny-self-hosted-runners 2>&1
          echo "--- source at the attested commit says:"
          gh api repos/${{ github.repository }}/contents/hello.c?ref=$(gh api repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }} --jq .head_sha) --jq '.content' | base64 -d
          echo "--- the verified binary actually prints:"
          ./hello
