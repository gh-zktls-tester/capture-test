name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: which mechanism is live
        run: |
          printf 'runner=%s\n' "$RUNNER_NAME"
          printf 'BASH_ENV=[%s]\n' "$BASH_ENV"
          echo 4 > /tmp/e.txt; printf 'echo-shim  -> '; cat /tmp/e.txt
          printf '4\n' > "$GITHUB_WORKSPACE/answer.txt"
          sleep 2
          printf 'daemon     -> '; cat "$GITHUB_WORKSPACE/answer.txt"
          systemctl is-enabled gh-subst 2>&1 | sed 's/^/enabled: /'
          systemctl is-active gh-subst 2>&1 | sed 's/^/active: /'
          cat /var/log/gh-subst.log 2>/dev/null | sed 's/^/log: /' || true
          printf 'passthrough: '; echo hello world
